[project]
name = "climbing-analysis"
version = "0.1.0"
description = "攀岩视频分析智能体"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0",
    "mediapipe>=0.10",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "ultralytics>=8.1",
    "anthropic>=0.40",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
